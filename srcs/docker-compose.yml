name: inception

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
      WP_VERSION: ${WP_VERSION:?Set WP_VERSION in .env}
      WP_TITLE: ${WP_TITLE:?Set WP_TITLE in .env}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?Set WP_ADMIN_USER in .env}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Set WP_ADMIN_EMAIL in .env}
      WP_USER: ${WP_USER:?Set WP_USER in .env}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?Set WP_USER_EMAIL in .env}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception

volumes:
  mariadb_data:
  wordpress_data:

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
